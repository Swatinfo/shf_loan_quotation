<VirtualHost 103.127.31.29:8080>

    ServerName app.shfworld.com
    
    ServerAdmin info@app.shfworld.com
    DocumentRoot /home/admin/web/app.shfworld.com/public_html/public
    ScriptAlias /cgi-bin/ /home/admin/web/app.shfworld.com/cgi-bin/
    Alias /vstats/ /home/admin/web/app.shfworld.com/stats/
    Alias /error/ /home/admin/web/app.shfworld.com/document_errors/
    #SuexecUserGroup admin admin
    CustomLog /var/log/apache2/domains/app.shfworld.com.bytes bytes
    CustomLog /var/log/apache2/domains/app.shfworld.com.log combined
    ErrorLog /var/log/apache2/domains/app.shfworld.com.error.log
    <Directory /home/admin/web/app.shfworld.com/stats>
        AllowOverride All
    </Directory>
    <Directory /home/admin/web/app.shfworld.com/public_html>
        AllowOverride All
        Options +Includes -Indexes -FollowSymLinks +SymLinksIfOwnerMatch
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.4-fpm-app.shfworld.com.sock|fcgi://localhost/"
    </FilesMatch>
    SetEnvIf Authorization .+ HTTP_AUTHORIZATION=$0

    IncludeOptional /home/admin/conf/web/apache2.app.shfworld.com.conf*

</VirtualHost>

