server {
    listen      103.127.31.29:443 ssl http2;
    server_name app.shfworld.com ;

    ssl_certificate      /home/admin/conf/web/ssl.app.shfworld.com.pem;
    ssl_certificate_key  /home/admin/conf/web/ssl.app.shfworld.com.key;
    error_log  /var/log/apache2/domains/app.shfworld.com.error.log error;

    location / {
        proxy_pass      https://103.127.31.29:8443;
        location ~* ^.+\.(jpeg|jpg|png|gif|bmp|ico|svg|tif|tiff|css|js|ttf|otf|webp|txt|csv|rtf|doc|docx|xls|xlsx|ppt|pptx|odf|odp|ods|odt|pdf|psd|ai|eot|eps|ps|zip|tar|tgz|gz|rar|bz2|7z|aac|m4a|mp3|mp4|ogg|wav|wma|3gp|avi|flv|m4v|mkv|mov|mpeg|mpg|wmv|exe|iso|dmg|swf|woff|woff2)$ {
            root           /home/admin/web/app.shfworld.com/public_html;
            access_log     /var/log/apache2/domains/app.shfworld.com.log combined;
            access_log     /var/log/apache2/domains/app.shfworld.com.bytes bytes;
            expires        max;
            # try_files      $uri @fallback;
        }
    }

    location /error/ {
        alias   /home/admin/web/app.shfworld.com/document_errors/;
    }

    location @fallback {
        proxy_pass      https://103.127.31.29:8443;
    }

    location ~ /\.ht    {return 404;}
    location ~ /\.svn/  {return 404;}
    location ~ /\.git/  {return 404;}
    location ~ /\.hg/   {return 404;}
    location ~ /\.bzr/  {return 404;}

    disable_symlinks if_not_owner from=/home/admin/web/app.shfworld.com/public_html;

    include /home/admin/conf/web/snginx.app.shfworld.com.conf*;
}

