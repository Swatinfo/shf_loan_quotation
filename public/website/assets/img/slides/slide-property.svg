<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" width="100%" height="100%">
  <defs>
    <linearGradient id="sPbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181515"/>
      <stop offset="50%" stop-color="#2b2526"/>
      <stop offset="100%" stop-color="#1c1918"/>
    </linearGradient>
    <radialGradient id="sPGlow" cx="50%" cy="90%" r="72%">
      <stop offset="0%" stop-color="#f99d3e" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#f15a29" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#f15a29" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sPKey" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffb066"/>
      <stop offset="100%" stop-color="#f15a29"/>
    </linearGradient>
    <linearGradient id="sPDoc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f99d3e"/>
      <stop offset="100%" stop-color="#d04316"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sPbg)"/>
  <rect width="1600" height="900" fill="url(#sPGlow)"/>

  <!-- Concentric decorative arcs bottom -->
  <g fill="none" stroke="#f15a29" stroke-opacity="0.08" stroke-width="2">
    <circle cx="800" cy="950" r="600"/>
    <circle cx="800" cy="950" r="780"/>
    <circle cx="800" cy="950" r="960"/>
    <circle cx="800" cy="950" r="1140"/>
  </g>

  <!-- Giant rupee watermark (right) -->
  <text x="1400" y="700" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="640"
        font-weight="700"
        fill="#f15a29"
        opacity="0.06">₹</text>

  <!-- Property-document stack (right side) -->
  <g transform="translate(1090, 240)" opacity="0.6">
    <!-- back page -->
    <rect x="50" y="35" width="280" height="370" rx="8" fill="#fff" opacity="0.12"/>
    <!-- middle page -->
    <rect x="28" y="18" width="280" height="370" rx="8" fill="#fff" opacity="0.2"/>
    <!-- front page (hero document) -->
    <rect x="0" y="0" width="280" height="370" rx="8" fill="url(#sPDoc)"/>
    <!-- document header band -->
    <rect x="0" y="0" width="280" height="50" rx="8" fill="#f15a29"/>
    <rect x="20" y="18" width="110" height="14" rx="2" fill="#fff" opacity="0.85"/>
    <circle cx="250" cy="25" r="12" fill="none" stroke="#fff" stroke-width="2" opacity="0.5"/>
    <text x="250" y="31" text-anchor="middle" font-family="Georgia, serif" font-size="16" font-weight="700" fill="#fff" opacity="0.85">₹</text>
    <!-- document body lines -->
    <g fill="#fff" opacity="0.5">
      <rect x="22" y="75" width="180" height="10" rx="3"/>
      <rect x="22" y="95" width="220" height="8" rx="3"/>
      <rect x="22" y="130" width="100" height="8" rx="3"/>
      <rect x="22" y="146" width="200" height="8" rx="3"/>
      <rect x="22" y="162" width="180" height="8" rx="3"/>
      <rect x="22" y="196" width="140" height="8" rx="3"/>
      <rect x="22" y="212" width="220" height="8" rx="3"/>
      <rect x="22" y="228" width="170" height="8" rx="3"/>
    </g>
    <!-- stamp/signature area -->
    <circle cx="55" cy="310" r="30" fill="none" stroke="#1c1918" stroke-width="2.5"/>
    <circle cx="55" cy="310" r="22" fill="none" stroke="#1c1918" stroke-width="1.5"/>
    <text x="55" y="318" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#1c1918">₹</text>
    <!-- signature line -->
    <line x1="120" y1="325" x2="240" y2="325" stroke="#1c1918" stroke-width="1.5" opacity="0.6"/>
    <path d="M130 315 Q150 300 180 320 T230 310" stroke="#1c1918" stroke-width="2" fill="none" opacity="0.5"/>
  </g>

  <!-- Stylised key (bottom-left) -->
  <g transform="translate(180, 640) rotate(-12)" opacity="0.55">
    <!-- key head -->
    <circle cx="0" cy="0" r="46" fill="url(#sPKey)"/>
    <circle cx="0" cy="0" r="20" fill="#1c1918"/>
    <!-- rupee inside key head -->
    <text y="7" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#ffb066">₹</text>
    <!-- key shaft -->
    <rect x="40" y="-8" width="200" height="16" fill="url(#sPKey)"/>
    <!-- teeth -->
    <rect x="200" y="-18" width="16" height="26" fill="url(#sPKey)"/>
    <rect x="225" y="-18" width="16" height="22" fill="url(#sPKey)"/>
  </g>

  <!-- Small floating rupee badges -->
  <g transform="translate(560, 180)" opacity="0.35">
    <circle r="28" fill="none" stroke="#f99d3e" stroke-width="1.5"/>
    <text y="9" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#f99d3e">₹</text>
  </g>
  <g transform="translate(950, 140)" opacity="0.3">
    <circle r="22" fill="none" stroke="#f15a29" stroke-width="1.5" stroke-dasharray="4,3"/>
  </g>

  <!-- Accent connecting lines -->
  <path d="M120 840 Q400 780 720 820" stroke="#f99d3e" stroke-opacity="0.22" stroke-width="2" fill="none"/>
  <path d="M920 120 Q1100 80 1260 160" stroke="#f15a29" stroke-opacity="0.22" stroke-width="1.5" fill="none"/>

  <!-- Subtle accent dots -->
  <g fill="#f15a29" opacity="0.45">
    <circle cx="1420" cy="700" r="3"/>
    <circle cx="740" cy="400" r="2"/>
    <circle cx="460" cy="600" r="2"/>
  </g>
</svg>
