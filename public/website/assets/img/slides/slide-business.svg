<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" width="100%" height="100%">
  <defs>
    <linearGradient id="sBbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1918"/>
      <stop offset="50%" stop-color="#272122"/>
      <stop offset="100%" stop-color="#15110f"/>
    </linearGradient>
    <radialGradient id="sBGlow" cx="20%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#f47929" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#f47929" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#f47929" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sBTower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f99d3e"/>
      <stop offset="100%" stop-color="#c8390e"/>
    </linearGradient>
    <linearGradient id="sBChart" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f15a29"/>
      <stop offset="100%" stop-color="#ffb066"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sBbg)"/>
  <rect width="1600" height="900" fill="url(#sBGlow)"/>

  <!-- Giant rupee watermark (left-centre) -->
  <text x="180" y="680" text-anchor="start"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="680"
        font-weight="700"
        fill="#f15a29"
        opacity="0.05">₹</text>

  <!-- Dot grid -->
  <g fill="#ffffff" fill-opacity="0.035">
    <circle cx="200" cy="200" r="2"/><circle cx="400" cy="200" r="2"/><circle cx="600" cy="200" r="2"/>
    <circle cx="800" cy="200" r="2"/><circle cx="1000" cy="200" r="2"/><circle cx="1200" cy="200" r="2"/><circle cx="1400" cy="200" r="2"/>
    <circle cx="200" cy="400" r="2"/><circle cx="400" cy="400" r="2"/><circle cx="600" cy="400" r="2"/>
    <circle cx="800" cy="400" r="2"/><circle cx="1000" cy="400" r="2"/><circle cx="1200" cy="400" r="2"/><circle cx="1400" cy="400" r="2"/>
    <circle cx="200" cy="600" r="2"/><circle cx="400" cy="600" r="2"/><circle cx="600" cy="600" r="2"/>
    <circle cx="800" cy="600" r="2"/><circle cx="1000" cy="600" r="2"/><circle cx="1200" cy="600" r="2"/><circle cx="1400" cy="600" r="2"/>
  </g>

  <!-- Growth chart (centre-left, upward bars) -->
  <g transform="translate(780, 520)" opacity="0.75">
    <!-- baseline -->
    <line x1="0" y1="160" x2="300" y2="160" stroke="#f99d3e" stroke-width="2" opacity="0.45"/>
    <!-- bars -->
    <rect x="10"  y="105" width="36" height="55"  fill="#f15a29" opacity="0.7" rx="3"/>
    <rect x="60"  y="80"  width="36" height="80"  fill="#f47929" opacity="0.75" rx="3"/>
    <rect x="110" y="60"  width="36" height="100" fill="#f99d3e" opacity="0.8" rx="3"/>
    <rect x="160" y="35"  width="36" height="125" fill="#ffb066" opacity="0.85" rx="3"/>
    <rect x="210" y="15"  width="36" height="145" fill="#ffc988" opacity="0.9" rx="3"/>
    <!-- trend line -->
    <polyline points="28,105 78,80 128,60 178,35 228,15" fill="none" stroke="#fff" stroke-width="2.5" opacity="0.6"/>
    <!-- arrow -->
    <polygon points="228,15 218,20 225,30" fill="#fff" opacity="0.6"/>
  </g>

  <!-- Office tower cluster (right side) -->
  <g transform="translate(1090, 260)" opacity="0.55">
    <!-- shadow -->
    <ellipse cx="220" cy="430" rx="220" ry="12" fill="#000" opacity="0.3"/>

    <!-- tower 1 (left, medium) -->
    <rect x="0" y="130" width="110" height="300" fill="url(#sBTower)"/>
    <g fill="#1c1918">
      <rect x="18" y="150" width="18" height="18"/><rect x="50" y="150" width="18" height="18"/><rect x="82" y="150" width="18" height="18"/>
      <rect x="18" y="185" width="18" height="18"/><rect x="50" y="185" width="18" height="18"/><rect x="82" y="185" width="18" height="18"/>
      <rect x="18" y="220" width="18" height="18"/><rect x="50" y="220" width="18" height="18"/><rect x="82" y="220" width="18" height="18"/>
      <rect x="18" y="255" width="18" height="18"/><rect x="50" y="255" width="18" height="18" fill="#f99d3e" opacity="0.6"/><rect x="82" y="255" width="18" height="18"/>
      <rect x="18" y="290" width="18" height="18"/><rect x="50" y="290" width="18" height="18"/><rect x="82" y="290" width="18" height="18"/>
      <rect x="18" y="325" width="18" height="18" fill="#f99d3e" opacity="0.5"/><rect x="50" y="325" width="18" height="18"/><rect x="82" y="325" width="18" height="18"/>
      <rect x="18" y="360" width="18" height="18"/><rect x="50" y="360" width="18" height="18"/><rect x="82" y="360" width="18" height="18"/>
      <rect x="18" y="395" width="18" height="18"/><rect x="50" y="395" width="18" height="18"/><rect x="82" y="395" width="18" height="18"/>
    </g>

    <!-- tower 2 (centre, tallest) -->
    <rect x="130" y="70" width="130" height="360" fill="url(#sBTower)" opacity="0.9"/>
    <!-- tower top antenna -->
    <rect x="189" y="30" width="12" height="40" fill="#f99d3e"/>
    <circle cx="195" cy="30" r="5" fill="#ffb066"/>
    <g fill="#1c1918">
      <rect x="148" y="95" width="22" height="22"/><rect x="182" y="95" width="22" height="22"/><rect x="216" y="95" width="22" height="22"/>
      <rect x="148" y="135" width="22" height="22"/><rect x="182" y="135" width="22" height="22"/><rect x="216" y="135" width="22" height="22"/>
      <rect x="148" y="175" width="22" height="22"/><rect x="182" y="175" width="22" height="22" fill="#f99d3e" opacity="0.5"/><rect x="216" y="175" width="22" height="22"/>
      <rect x="148" y="215" width="22" height="22"/><rect x="182" y="215" width="22" height="22"/><rect x="216" y="215" width="22" height="22"/>
      <rect x="148" y="255" width="22" height="22"/><rect x="182" y="255" width="22" height="22"/><rect x="216" y="255" width="22" height="22"/>
      <rect x="148" y="295" width="22" height="22" fill="#f99d3e" opacity="0.5"/><rect x="182" y="295" width="22" height="22"/><rect x="216" y="295" width="22" height="22"/>
      <rect x="148" y="335" width="22" height="22"/><rect x="182" y="335" width="22" height="22"/><rect x="216" y="335" width="22" height="22"/>
      <rect x="148" y="375" width="22" height="22"/><rect x="182" y="375" width="22" height="22"/><rect x="216" y="375" width="22" height="22"/>
    </g>

    <!-- tower 3 (right, shortest) -->
    <rect x="280" y="180" width="90" height="250" fill="url(#sBTower)" opacity="0.7"/>
    <g fill="#1c1918">
      <rect x="295" y="200" width="16" height="16"/><rect x="320" y="200" width="16" height="16"/><rect x="345" y="200" width="16" height="16"/>
      <rect x="295" y="230" width="16" height="16"/><rect x="320" y="230" width="16" height="16"/><rect x="345" y="230" width="16" height="16"/>
      <rect x="295" y="260" width="16" height="16"/><rect x="320" y="260" width="16" height="16" fill="#f99d3e" opacity="0.5"/><rect x="345" y="260" width="16" height="16"/>
      <rect x="295" y="290" width="16" height="16"/><rect x="320" y="290" width="16" height="16"/><rect x="345" y="290" width="16" height="16"/>
      <rect x="295" y="320" width="16" height="16"/><rect x="320" y="320" width="16" height="16"/><rect x="345" y="320" width="16" height="16"/>
      <rect x="295" y="350" width="16" height="16"/><rect x="320" y="350" width="16" height="16"/><rect x="345" y="350" width="16" height="16"/>
      <rect x="295" y="380" width="16" height="16"/><rect x="320" y="380" width="16" height="16"/><rect x="345" y="380" width="16" height="16"/>
    </g>
  </g>

  <!-- Floating briefcase icon with rupee -->
  <g transform="translate(180, 220)" opacity="0.7">
    <rect x="0" y="20" width="90" height="70" fill="#f15a29" rx="6"/>
    <rect x="32" y="10" width="26" height="14" fill="none" stroke="#f15a29" stroke-width="3" rx="2"/>
    <!-- rupee on briefcase -->
    <text x="45" y="65" text-anchor="middle" font-family="Georgia, serif" font-size="40" font-weight="700" fill="#fff">₹</text>
  </g>

  <!-- Floating accent dots -->
  <g fill="#f99d3e" opacity="0.4">
    <circle cx="1420" cy="180" r="3"/>
    <circle cx="140" cy="540" r="3"/>
    <circle cx="1500" cy="700" r="3"/>
  </g>
</svg>
